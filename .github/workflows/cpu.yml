name: CPU regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PYTHONHASHSEED: '0'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTEST_ADDOPTS: ''
      CUDA_VISIBLE_DEVICES: ''
      TILA_DEBUG: '0'
      TILA_SAFETY: strict
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11.9'
      - name: Install CPU dependencies and package
        run: |
          python -m pip install -r ci/cpu/requirements.txt
          python -m pip install --no-deps --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0+cpu'
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
          python - <<'PY'
          import importlib.util
          import torch
          assert torch.__version__ == '2.10.0+cpu' and torch.version.cuda is None
          assert importlib.util.find_spec('triton') is None
          PY
      - name: Regression and golden snapshots
        run: |
          python -m pytest -q --junitxml=artifacts/cpu/results.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse('artifacts/cpu/results.xml').findall('.//testcase')
          if not cases or any(c.find(tag) is not None for c in cases
                              for tag in ('skipped', 'failure', 'error')):
              raise SystemExit('CPU acceptance requires nonempty tests with no skips/failures/errors')
          import json
          uniformity = json.load(open('artifacts/cpu/m4-05d-uniformity-summary.json'))
          if not uniformity['complete'] or uniformity['status'] != 'passed' or uniformity['cases'] != 68:
              raise SystemExit('M4-05d acceptance requires all 68 fixed cases')
          print(f'CPU acceptance: {len(cases)} passed, zero skipped')
          PY
      - name: Save hosted CPU test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpu-test-report
          path: |
            artifacts/cpu/results.xml
            artifacts/cpu/m4-04d-race-summary.json
            artifacts/cpu/c2-summary.json
            artifacts/cpu/m4-05d-uniformity-summary.json
            artifacts/c2-audit/
            artifacts/uniformity-audit/
            artifacts/m2-proof-audit/
            artifacts/race-audit/
          if-no-files-found: warn
          retention-days: 14
