[project]
name = "tila-gpu-validation"
version = "0.0.0"
requires-python = "==3.11.9"
dependencies = [
  "torch==2.10.0+cu128",
  "triton==3.6.0",
  "numpy==1.24.3",
  "ml-dtypes==0.5.4",
  "pytest==7.4.4",
  "z3-solver==4.16.0.0",
  "setuptools==75.8.0",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
