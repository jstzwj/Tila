[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tila-lang"
version = "0.3.0.dev0"
description = "Tila: a statically strongly-typed GPU kernel DSL (shape + refinement + effects + pointer capabilities) that compiles to Triton"
requires-python = ">=3.10"
dependencies = ["numpy", "z3-solver==4.16.0.0"]

[project.optional-dependencies]
dev = ["pytest", "numpy", "ml_dtypes"]
interp = ["numpy", "ml_dtypes"]
triton = ["triton==3.6.0"]

[project.scripts]
tila = "tila.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires triton + CUDA (and a working C compiler for the backend)"]
